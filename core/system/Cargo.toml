[package]
name = "ds_emu"
description = "The DS system: CPUs, memory bus, DMA and scheduler wiring every component"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
snafu = { workspace = true }

# workspace members
ds_bios = { workspace = true }
ds_cartridge = { workspace = true }
ds_interrupt = { workspace = true }
ds_mem_addr = { workspace = true }
ds_gpu = { workspace = true }
ds_peripherals = { workspace = true }
ds_spu = { workspace = true }

[dev-dependencies]
quick_tracing = { version = "0.1.5", features = ["derive"] }
image = { version = "0.25.9" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["tracing"]
tracing = ["dep:tracing", "ds_bios/tracing", "ds_cartridge/tracing", "ds_peripherals/tracing"]

# TODO:
[lints]
workspace = true
